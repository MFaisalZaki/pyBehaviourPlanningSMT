[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviour-planning-smt"
version = "0.2.0"
authors = [
  { name = "MFaisalZaki", email = "mustafa.faisal.eng@gmail.com" },
]
description = "Behaviour planning over domain models using SMT solvers (C++ core with a unified-planning interface)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]
dependencies = [
    "unified-planning>=1.3.0",
    "protobuf<6.0",
    "z3-solver>=4.13.0.0",
]

[project.entry-points."unified_planning.engines"]
BehaviourPlanningSMT = "behaviour_planning_smt.planner_wrapper:BehaviourPlanningSMTPlanner"

[project.urls]
"Homepage" = "https://github.com/MFaisalZaki/pyBehaviourPlanningSMT"
"Repository" = "https://github.com/MFaisalZaki/pyBehaviourPlanningSMT"

[tool.setuptools]
packages = ["behaviour_planning_smt", "behaviour_planning_smt.fbi"]
include-package-data = true

[tool.setuptools.package-data]
behaviour_planning_smt = ["bin/*", "cpp/**/*"]

[tool.setuptools.exclude-package-data]
behaviour_planning_smt = ["cpp/build/**"]
